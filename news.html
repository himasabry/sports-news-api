<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الأخبار الرياضية</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tajawal,sans-serif;
}

body{
background:#0b0b0f;
color:#fff;
padding-bottom:100px;
}

/* HEADER */

.header{
position:fixed;
top:0;
right:0;
left:0;
height:75px;
background:rgba(17,24,39,0.85);
backdrop-filter:blur(15px);
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
z-index:1000;
border-bottom:1px solid #1f2937;
}

.header i{
margin-left:10px;
color:#00bfff;
}

/* NEWS */

.news-container{
padding:95px 15px 100px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:15px;
}

.news-card{
background:#161b22;
border-radius:20px;
overflow:hidden;
border:1px solid #222;
cursor:pointer;
transition:.3s;
}

.news-card:hover{
transform:translateY(-5px);
border-color:#00bfff;
}

.news-image{
width:100%;
height:200px;
object-fit:cover;
background:#000;
}

.news-content{
padding:15px;
}

.news-title{
font-size:18px;
font-weight:bold;
line-height:1.8;
margin-bottom:10px;
}

.news-desc{
font-size:14px;
line-height:1.8;
color:#cbd5e1;
}

.news-date{
font-size:12px;
color:#94a3b8;
margin-top:12px;
}

/* LOADING */

.loading{
padding-top:150px;
text-align:center;
font-size:20px;
color:#00bfff;
}

/* MODAL */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,0.85);
display:none;
justify-content:center;
align-items:center;
z-index:9999;
padding:20px;
}

.modal-content{
background:#161b22;
width:100%;
max-width:500px;
border-radius:20px;
overflow:hidden;
position:relative;
animation:show .3s ease;
}

@keyframes show{
from{
transform:scale(.8);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

.modal img{
width:100%;
height:250px;
object-fit:cover;
}

.modal-body{
padding:15px;
}

.modal-title{
font-size:20px;
font-weight:bold;
margin-bottom:15px;
line-height:1.8;
}

.modal-desc{
font-size:15px;
line-height:2;
color:#cbd5e1;
}

.close{
position:absolute;
top:10px;
left:10px;
background:#00bfff;
color:#000;
border:none;
width:35px;
height:35px;
border-radius:50%;
font-size:18px;
cursor:pointer;
font-weight:bold;
}

/* BOTTOM NAV */

.bottom-nav{
position:fixed;
bottom:15px;
right:15px;
left:15px;
height:70px;
background:rgba(17,24,39,0.85);
backdrop-filter:blur(15px);
display:flex;
justify-content:space-around;
align-items:center;
border-radius:25px;
z-index:1000;
}

.nav-item{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-decoration:none;
color:#9ca3af;
font-size:11px;
transition:.3s;
}

.nav-item i{
font-size:20px;
margin-bottom:5px;
}

.nav-item.active{
color:#00bfff;
transform:translateY(-6px);
}

.nav-item.active i{
background:#00bfff;
color:#0b0b0f;
padding:10px;
border-radius:50%;
}

</style>

</head>

<body>

<!-- HEADER -->

<div class="header">

<i class="fas fa-newspaper"></i>

الأخبار الرياضية

</div>

<!-- NEWS -->

<div id="newsContainer" class="news-container">

<div class="loading">

جاري تحميل الأخبار...

</div>

</div>

<!-- MODAL -->

<div class="modal" id="modal">

<div class="modal-content">

<button class="close"
onclick="closeModal()">✕</button>

<img id="modalImg"
src="">

<div class="modal-body">

<div class="modal-title"
id="modalTitle"></div>

<div class="modal-desc"
id="modalDesc"></div>

</div>

</div>

</div>

<!-- BOTTOM NAV -->

<div class="bottom-nav">

<a href="index.html" class="nav-item">

<i class="fas fa-home"></i>

<span>الرئيسية</span>

</a>

<a href="matches.html" class="nav-item">

<i class="fas fa-futbol"></i>

<span>المباريات</span>

</a>

<a href="news.html"
class="nav-item active">

<i class="fas fa-newspaper"></i>

<span>الأخبار</span>

</a>

<a href="settings.html"
class="nav-item">

<i class="fas fa-cog"></i>

<span>الإعدادات</span>

</a>

</div>

<script>

let newsData = [];

/* تحميل الأخبار */

async function loadNews(){

const container =
document.getElementById("newsContainer");

container.innerHTML = `

<div class="loading">

جاري تحميل الأخبار...

</div>

`;

try{

/* API */

const res =
await fetch("/api/news");

/* تحقق */

if(!res.ok){

throw new Error("API ERROR");

}

const data =
await res.json();

/* لا توجد بيانات */

if(!data || !data.data){

container.innerHTML = `

<div class="loading">

لا توجد أخبار حاليا

</div>

`;

return;

}

/* تخزين */

newsData = data.data;

/* تنظيف */

container.innerHTML = "";

/* عرض الأخبار */

newsData.forEach((article,i)=>{

const title =
article.title ||
"بدون عنوان";

const desc =
article.description ||
"اضغط لقراءة تفاصيل الخبر";

const image =
article.image ||
"https://images.unsplash.com/photo-1508098682722-e99c643e7485?q=80&w=1200";

const date =
article.pubDate
? new Date(article.pubDate)
.toLocaleString('ar-EG')
: "";

container.innerHTML += `

<div class="news-card"
onclick="openModal(${i})">

<img class="news-image"

src="${image}"

onerror="this.src='https://images.unsplash.com/photo-1508098682722-e99c643e7485?q=80&w=1200'">

<div class="news-content">

<div class="news-title">

${title}

</div>

<div class="news-desc">

${desc}

</div>

<div class="news-date">

${date}

</div>

</div>

</div>

`;

});

}catch(err){

console.log(err);

container.innerHTML = `

<div class="loading">

فشل تحميل الأخبار

</div>

`;

}

}

/* فتح التفاصيل */

function openModal(i){

const item = newsData[i];

document.getElementById("modalImg").src =

item.image ||
"https://images.unsplash.com/photo-1508098682722-e99c643e7485?q=80&w=1200";

document.getElementById("modalTitle").innerText =

item.title || "";

document.getElementById("modalDesc").innerText =

item.description || "";

document.getElementById("modal").style.display =

"flex";

}

/* إغلاق */

function closeModal(){

document.getElementById("modal").style.display =

"none";

}

/* إغلاق عند الضغط بالخارج */

window.onclick = function(e){

const modal =
document.getElementById("modal");

if(e.target == modal){

closeModal();

}

}

/* تشغيل */

loadNews();

/* تحديث كل 5 دقائق */

setInterval(loadNews,300000);

</script>

</body>
</html>
